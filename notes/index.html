<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frequent Notes</title>
<meta name="description" content="One inbox for ideas you text, write on paper or type. Link them and see them again. Free, no account, works offline.">
<meta name="copyright" content="© 2026 Daniel Ilias Houlis. All rights reserved. Frequent is a trademark of Daniel Ilias Houlis.">
<meta name="theme-color" content="#f5f1e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notes">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.svg" alt="" width="26" height="26"><span><span class="fq">Frequent </span><b>Notes</b></span></div>
  <button class="mo" id="mo" aria-label="Items in your inbox"><span class="mo-q">Inbox</span> <b id="moN">0</b></button>
  <button class="menu-b" id="menuB" aria-label="Menu" aria-haspopup="true">⋯</button>
</header>
<div class="menu" id="menu" hidden>
  <button data-act="symbols">Handwriting symbols</button>
  <button data-act="template">Download a reMarkable page</button>
  <button data-act="obsidian">Export for Obsidian</button>
  <button data-act="backup">Save a backup file</button>
  <label class="file-b">Restore from a backup<input type="file" id="restore" accept="application/json,.json"></label>
</div>
<main id="main" tabindex="-1"></main>
<nav class="tabs" aria-label="Sections">
  <button data-tab="today" class="on">Today</button>
  <button data-tab="notes">Notes</button>
  <button data-tab="review">Review <span id="dueN" class="cnt" hidden></span></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastT"></span><button id="toastU" hidden>Undo</button></div>
<script src="app.js?v=1"></script>
</body>
</html>
